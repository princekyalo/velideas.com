/* =========================================================
   VARIABLES
========================================================= */

:root{

    --ink:#1C2033;
    --ink-soft:#545E75;
    --muted:#8890A0;

    --indigo-deep:#232C4C;
    --indigo:#384B87;

    --amber:#DDA352;
    --amber-deep:#C97D3D;

    --paper:#EEF0F5;
    --surface:#FFFFFF;

    --line:#DBE0EA;

    --positive:#3F8467;
    --negative:#B85B4A;

    --gradient:
        linear-gradient(
            135deg,
            var(--indigo-deep) 0%,
            var(--indigo) 48%,
            var(--amber) 100%
        );

    --max:900px;

    --serif:"Fraunces", serif;
    --sans:"Public Sans", sans-serif;
    --mono:"IBM Plex Mono", monospace;
}


/* =========================================================
   BASE
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    background:var(--paper);

    color:var(--ink);

    font-family:var(--sans);

    -webkit-font-smoothing:antialiased;

    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

::selection{
    background:var(--amber);
    color:var(--indigo-deep);
}


/* =========================================================
   NAVIGATION
========================================================= */

.navbar{

    width:min(1180px, calc(100% - 56px));

    height:84px;

    margin:0 auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:1px solid var(--line);
}

.logo{

    display:flex;

    align-items:center;

    gap:10px;
}

.logo svg{

    width:26px;
    height:26px;
}

.logo span{

    font-family:var(--serif);

    font-weight:560;

    font-size:21px;

    letter-spacing:-.3px;

    color:var(--ink);
}

.nav-links{

    display:flex;

    align-items:center;

    gap:32px;
}

.nav-links a{

    position:relative;

    padding:4px 0;

    color:var(--ink-soft);

    font-size:15px;

    font-weight:500;
}

.nav-links a::after{

    content:"";

    position:absolute;

    left:0;

    bottom:-3px;

    width:0;

    height:1.5px;

    background:var(--amber-deep);

    transition:width .2s ease;
}

.nav-links a:hover{

    color:var(--ink);
}

.nav-links a:hover::after{

    width:100%;
}


/* =========================================================
   ARTICLE HEADER
========================================================= */

.article-header{

    max-width:var(--max);

    margin:0 auto;

    padding:82px 0 55px;
}

.article-label{

    display:inline-flex;

    align-items:center;

    gap:8px;

    margin-bottom:20px;

    color:var(--indigo);

    font-family:var(--mono);

    font-size:12px;

    letter-spacing:.5px;

    text-transform:uppercase;
}

.article-label::before{

    content:"";

    width:7px;

    height:7px;

    border-radius:50%;

    background:var(--amber-deep);
}

.article-header h1{

    max-width:800px;

    font-family:var(--serif);

    font-weight:480;

    font-size:clamp(42px, 6vw, 64px);

    line-height:1.05;

    letter-spacing:-.7px;

    color:var(--ink);
}

.article-intro{

    max-width:720px;

    margin-top:25px;

    color:var(--ink-soft);

    font-size:18px;

    line-height:1.75;
}

.article-meta{

    display:flex;

    gap:18px;

    flex-wrap:wrap;

    margin-top:25px;

    color:var(--muted);

    font-family:var(--mono);

    font-size:11px;
}


/* =========================================================
   ARTICLE
========================================================= */

.article{

    max-width:var(--max);

    margin:0 auto;

    padding-bottom:100px;
}

.article-section{

    margin-bottom:55px;
}

.article-section h2{

    margin-bottom:17px;

    font-family:var(--serif);

    font-weight:480;

    font-size:31px;

    line-height:1.2;

    letter-spacing:-.3px;

    color:var(--ink);
}

.article-section h3{

    margin:30px 0 10px;

    font-family:var(--serif);

    font-weight:480;

    font-size:22px;
}

.article-section p{

    margin-bottom:18px;

    color:var(--ink-soft);

    font-size:16px;

    line-height:1.8;
}

.article-section ul{

    margin:18px 0 22px 22px;
}

.article-section li{

    margin-bottom:10px;

    padding-left:5px;

    color:var(--ink-soft);

    font-size:15.5px;

    line-height:1.7;
}


/* =========================================================
   HIGHLIGHT
========================================================= */

.highlight{

    margin:30px 0;

    padding:25px 26px;

    background:var(--surface);

    border:1px solid var(--line);

    border-left:4px solid var(--amber-deep);

    border-radius:10px;
}

.highlight strong{

    display:block;

    margin-bottom:7px;

    color:var(--ink);

    font-family:var(--serif);

    font-size:19px;
}

.highlight p{

    margin:0;

    font-size:14.5px;

    line-height:1.7;
}


/* =========================================================
   STEPS
========================================================= */

.steps{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:16px;

    margin:28px 0;
}

.step{

    padding:22px;

    background:var(--surface);

    border:1px solid var(--line);

    border-radius:12px;
}

.step-number{

    margin-bottom:13px;

    color:var(--amber-deep);

    font-family:var(--mono);

    font-size:11px;
}

.step h3{

    margin:0 0 8px;

    font-family:var(--serif);

    font-size:20px;
}

.step p{

    margin:0;

    font-size:14px;
}


/* =========================================================
   COMPARISON TABLE
========================================================= */

.compare{

    width:100%;

    margin:28px 0;

    border-collapse:collapse;

    background:var(--surface);

    border:1px solid var(--line);

    border-radius:12px;

    overflow:hidden;
}

.compare th,
.compare td{

    padding:15px;

    text-align:left;

    border-bottom:1px solid var(--line);

    font-size:14px;

    line-height:1.5;
}

.compare th{

    background:#F5F6F9;

    color:var(--ink);

    font-weight:600;
}

.compare td{

    color:var(--ink-soft);
}

.compare tr:last-child td{

    border-bottom:none;
}


/* =========================================================
   WARNING
========================================================= */

.warning{

    margin:30px 0;

    padding:24px;

    background:#FBF7F4;

    border:1px solid #E9D9CF;

    border-radius:10px;
}

.warning strong{

    display:block;

    margin-bottom:8px;

    color:var(--negative);

    font-size:15px;
}

.warning p{

    margin:0;

    color:var(--ink-soft);

    font-size:14px;

    line-height:1.7;
}


/* =========================================================
   WHATSAPP CTA
========================================================= */

.article-cta{

    margin-top:65px;

    padding:34px;

    background:var(--gradient);

    border-radius:14px;

    color:#fff;
}

.article-cta h2{

    margin-bottom:10px;

    color:#fff;

    font-family:var(--serif);

    font-weight:480;

    font-size:30px;
}

.article-cta p{

    max-width:600px;

    margin-bottom:22px;

    color:rgba(255,255,255,.84);

    font-size:15px;

    line-height:1.7;
}

.cta-button{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    min-height:50px;

    padding:0 23px;

    background:#fff;

    color:var(--indigo-deep);

    border-radius:8px;

    font-size:14px;

    font-weight:700;

    transition:
        transform .2s ease,
        background .2s ease;
}

.cta-button:hover{

    background:#F4F5F8;

    transform:translateY(-2px);
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    width:min(1180px, calc(100% - 56px));

    margin:0 auto;

    padding:25px 0 35px;

    border-top:1px solid var(--line);

    display:flex;

    align-items:center;

    justify-content:space-between;

    color:var(--muted);

    font-size:12px;
}

.footer-brand{

    font-family:var(--serif);

    font-size:15px;

    color:var(--ink-soft);
}

.footer-note{

    font-family:var(--mono);

    font-size:11px;
}


/* =========================================================
   WHATSAPP POPUP
========================================================= */

.assistance-popup-overlay{

    position:fixed;

    inset:0;

    z-index:999;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:rgba(28,32,51,.48);

    backdrop-filter:blur(6px);
}

.assistance-popup-overlay.active{

    display:flex;
}

.assistance-popup{

    width:min(470px,100%);

    position:relative;

    padding:32px;

    background:var(--surface);

    border:1px solid var(--line);

    border-radius:14px;

    box-shadow:0 30px 70px rgba(28,32,51,.22);

    animation:popupIn .25s ease-out;
}

@keyframes popupIn{

    from{

        opacity:0;

        transform:translateY(10px) scale(.98);
    }

    to{

        opacity:1;

        transform:none;
    }
}

.popup-close{

    position:absolute;

    top:14px;

    right:14px;

    width:32px;

    height:32px;

    border:1px solid var(--line);

    border-radius:8px;

    background:#fff;

    color:var(--muted);

    font-size:19px;

    cursor:pointer;
}

.popup-close:hover{

    color:var(--ink);

    border-color:var(--indigo);
}

.popup-label{

    display:inline-flex;

    align-items:center;

    gap:7px;

    margin-bottom:13px;

    color:#168C64;

    font-family:var(--mono);

    font-size:11px;

    letter-spacing:.5px;

    text-transform:uppercase;
}

.popup-label::before{

    content:"";

    width:7px;

    height:7px;

    border-radius:50%;

    background:#20B77A;
}

.assistance-popup h2{

    margin-bottom:12px;

    font-family:var(--serif);

    font-weight:480;

    font-size:30px;

    line-height:1.15;
}

.assistance-popup p{

    margin-bottom:23px;

    color:var(--ink-soft);

    font-size:14.5px;

    line-height:1.7;
}

.popup-actions{

    display:flex;

    gap:10px;
}

.whatsapp-button{

    flex:1;

    min-height:50px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:8px;

    background:#20B77A;

    color:#fff;

    font-size:14px;

    font-weight:700;

    transition:
        background .2s ease,
        transform .2s ease;
}

.whatsapp-button:hover{

    background:#168C64;

    transform:translateY(-1px);
}

.popup-dismiss{

    min-height:50px;

    padding:0 18px;

    border:1px solid var(--line);

    border-radius:8px;

    background:var(--paper);

    color:var(--ink-soft);

    font-family:var(--sans);

    font-size:14px;

    font-weight:600;

    cursor:pointer;
}

.popup-dismiss:hover{

    border-color:var(--indigo);

    color:var(--ink);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:950px){

    .article-header,
    .article{

        width:calc(100% - 56px);
    }

    .steps{

        grid-template-columns:1fr;
    }
}

    .navbar,
    .article-header,
    .article,
    .footer{

        width:calc(100% - 36px);

        gap:17px;
    }

    .nav-links a{

        font-size:13px;
    }

    .article-header{

        padding:57px 0 42px;
    }

    .article-header h1{

        font-size:40px;
    }
